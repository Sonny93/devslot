# Release: dispatch from main with an increment (patch, minor, major).
#
# Order matters. The checks and a static musl smoke build run first, so a
# broken build never gets a tag. The reusable release workflow then bumps
# Cargo.toml, Cargo.lock and package.json, updates CHANGELOG.md, tags and
# creates the GitHub release with the deploy key. The packages are built last,
# from the tag, and attached to that release: a package build failure leaves a
# release without packages, which `gh release upload --clobber` fixes by
# re-running the failed jobs.
#
# The build job has no write permission and no cache (a poisoned cache must
# not reach a released binary); only the upload job can write to the release.
#
# The first release is dispatched with `minor`: the version starts at 0.0.0
# and becomes 0.1.0.

name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        required: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ARTIFACT_NAME: release-packages
  MUSL_TARGET: x86_64-unknown-linux-musl
  NFPM_VERSION: 2.49.0
  NFPM_SHA256: 2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  musl-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup target add "$MUSL_TARGET"

      - run: cargo build --release --locked --target "$MUSL_TARGET"

  release:
    needs: [checks, musl-check]
    permissions:
      contents: write
    uses: minimalstuff/tooling/.github/workflows/release.yml@cedcf7f841898d78c641bb035147e3ab5f7ea519 # v0.11.0
    with:
      increment: ${{ inputs.increment }}
      check-release-command: node scripts/check-release.mjs
      node-version-file: .node-version
    secrets:
      release-deploy-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

  build:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
          fetch-depth: 0

      - name: Check the checkout is the release tag
        run: |
          set -euo pipefail
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "Release tag $TAG does not match version v$VERSION" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "$TAG^{commit}")" ]]; then
            echo "HEAD is not the commit of $TAG" >&2
            exit 1
          fi

      - run: rustup target add "$MUSL_TARGET"

      - run: cargo build --release --locked --target "$MUSL_TARGET"

      - name: Verify the binary is static, versioned and carries its commit
        run: |
          set -euo pipefail
          BINARY="target/$MUSL_TARGET/release/ds"
          REPORTED=$("$BINARY" --version)
          if [[ "$REPORTED" != "ds $VERSION" ]]; then
            echo "'ds --version' printed '$REPORTED', expected 'ds $VERSION'" >&2
            exit 1
          fi
          FILE_REPORT=$(file "$BINARY")
          if [[ "$FILE_REPORT" != *"statically linked"* && "$FILE_REPORT" != *"static-pie linked"* ]]; then
            echo "$BINARY is not statically linked: $FILE_REPORT" >&2
            exit 1
          fi
          COMMIT=$(git rev-parse HEAD)
          if [[ "$(grep -c -a -F -- "$COMMIT" "$BINARY")" -lt 1 ]]; then
            echo "$BINARY does not contain the commit $COMMIT" >&2
            exit 1
          fi

      - name: Install nfpm
        run: |
          set -euo pipefail
          ARCHIVE="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$ARCHIVE"
          echo "$NFPM_SHA256  $RUNNER_TEMP/$ARCHIVE" | sha256sum --check -
          mkdir "$RUNNER_TEMP/nfpm"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/nfpm" nfpm
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"

      - name: Build the packages and the tarball
        run: |
          set -euo pipefail
          mkdir dist
          nfpm package --config packaging/nfpm.yaml --packager deb --target "dist/devslot_${VERSION}_amd64.deb"
          nfpm package --config packaging/nfpm.yaml --packager archlinux --target "dist/devslot-${VERSION}-1-x86_64.pkg.tar.zst"
          TARBALL_ROOT="$RUNNER_TEMP/devslot-$VERSION"
          mkdir "$TARBALL_ROOT"
          cp "target/$MUSL_TARGET/release/ds" packaging/install.sh packaging/setup-plugin.sh README.md LICENSE CHANGELOG.md "$TARBALL_ROOT"
          tar --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP" -czf "dist/devslot-${VERSION}-x86_64-linux.tar.gz" "devslot-$VERSION"

      - name: Verify the Debian package
        run: |
          set -euo pipefail
          PACKAGE="dist/devslot_${VERSION}_amd64.deb"
          INFO=$(dpkg-deb --info "$PACKAGE")
          if ! grep -qx " Version: $VERSION" <<< "$INFO"; then
            echo "$PACKAGE does not carry version $VERSION" >&2
            echo "$INFO" >&2
            exit 1
          fi
          CONTENTS=$(dpkg-deb --contents "$PACKAGE")
          for EXPECTED in ./usr/bin/ds ./usr/share/devslot/setup-plugin.sh ./usr/share/doc/devslot/copyright; do
            if ! grep -q " $EXPECTED\$" <<< "$CONTENTS"; then
              echo "$PACKAGE has no $EXPECTED" >&2
              exit 1
            fi
          done

      - name: Verify the Arch package
        run: |
          set -euo pipefail
          PACKAGE="dist/devslot-${VERSION}-1-x86_64.pkg.tar.zst"
          LISTING=$(tar -I zstd -tf "$PACKAGE")
          for EXPECTED in .PKGINFO usr/bin/ds usr/share/devslot/setup-plugin.sh usr/share/licenses/devslot/LICENSE; do
            if ! grep -qx "$EXPECTED" <<< "$LISTING"; then
              echo "$PACKAGE has no $EXPECTED" >&2
              exit 1
            fi
          done
          PKGINFO=$(tar -I zstd -xOf "$PACKAGE" .PKGINFO)
          if ! grep -qx "pkgver = $VERSION-1" <<< "$PKGINFO"; then
            echo "$PACKAGE does not carry pkgver $VERSION-1" >&2
            echo "$PKGINFO" >&2
            exit 1
          fi

      - name: Write the checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- devslot* > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  upload:
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/packages

      - name: Attach the packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          PACKAGES_DIRECTORY: ${{ runner.temp }}/packages
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$PACKAGES_DIRECTORY"/* --clobber --repo "$GITHUB_REPOSITORY"
